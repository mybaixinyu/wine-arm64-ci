name: build

# Rebuilds single modules of athei/wine-build's arm64 Wine with patches/ on
# top, to drop into an installed bundle of the same Wine commit. Each module is
# built twice in one tree, without and with the patches, so the unpatched copy
# can be compared against the one the bundle ships. Manual only.
on:
  workflow_dispatch:
    inputs:
      wine_ref:
        description: athei/wine full commit SHA the bundle was built from (wine --version names it)
        default: e2e42653b41e48fc7a6ed00569d3aaea9719ed5b
        type: string

permissions:
  contents: read

env:
  # bin/lib/profile.sh of athei/wine-build: MACOS_FLOOR, HOST_TRIPLE, WINE_ARCHS
  MACOSX_DEPLOYMENT_TARGET: "26.4"
  HOST_TRIPLE: aarch64-apple-darwin
  WINE_ARCHS: arm64ec,aarch64,i386
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW: llvm-mingw-20261006-ucrt-macos-universal
  LLVM_MINGW_SHA256: a7a19b11048e89372637d26279cdb7c430ed3cf8c1e224310421312bf986ebf6
  TARGETS: >-
    dlls/winecoreaudio.drv/winecoreaudio.so dlls/winemac.drv/winemac.so
    dlls/dsound/i386-windows/dsound.dll dlls/wininet/i386-windows/wininet.dll

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: athei/wine
          ref: ${{ inputs.wine_ref }}
          path: wine
          fetch-depth: 1
      - name: Toolchain
        run: |
          brew install bison
          curl -fsSL -o "$RUNNER_TEMP/$LLVM_MINGW.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/$LLVM_MINGW.tar.xz" | shasum -a 256 -c
          tar -xf "$RUNNER_TEMP/$LLVM_MINGW.tar.xz" -C "$RUNNER_TEMP"
          xcrun --show-sdk-version
      # llvm-mingw goes after the system PATH: its unprefixed clang breaks
      # configure's host compiler detection (docs/arm64.md of wine-build).
      - name: Configure
        run: |
          export PATH="$PATH:$RUNNER_TEMP/$LLVM_MINGW/bin"
          mkdir build && cd build
          ../wine/configure --enable-archs="$WINE_ARCHS" \
            CC="clang -arch arm64" --host="$HOST_TRIPLE" --disable-tests \
            BISON="$(brew --prefix bison)/bin/bison" \
            --with-mingw --with-coreaudio \
            --without-alsa --without-capi --without-cups --without-dbus --without-ffmpeg \
            --without-fontconfig --without-freetype --without-gettext --without-gnutls \
            --without-gphoto --without-gssapi --without-gstreamer --without-hwloc \
            --without-inotify --without-krb5 --without-netapi --without-opencl --without-oss \
            --without-pcap --without-pcsclite --without-pulse --without-sane --without-sdl \
            --without-udev --without-usb --without-v4l2 --without-va --without-vulkan \
            --without-wayland --without-x
      - name: Build unpatched
        run: |
          export PATH="$PATH:$RUNNER_TEMP/$LLVM_MINGW/bin"
          make -C build -j"$(sysctl -n hw.ncpu)" $TARGETS
          for t in $TARGETS; do mkdir -p "out/unpatched/$(dirname "$t")"; cp "build/$t" "out/unpatched/$t"; done
      - name: Build patched
        run: |
          export PATH="$PATH:$RUNNER_TEMP/$LLVM_MINGW/bin"
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do git -C wine apply --verbose "$p"; done
          make -C build -j"$(sysctl -n hw.ncpu)" $TARGETS
          for t in $TARGETS; do mkdir -p "out/patched/$(dirname "$t")"; cp "build/$t" "out/patched/$t"; done
      # The bundle ships its PE files stripped with llvm-strip --strip-all
      # (strip_pe in bundle-wine.sh), which keeps Wine's builtin marker.
      - name: Strip PE files
        run: |
          for f in out/*/dlls/*/i386-windows/*.dll; do
            "$RUNNER_TEMP/$LLVM_MINGW/bin/llvm-strip" --strip-all "$f"
            grep -q "Wine builtin DLL" "$f" || { echo "$f lost its builtin marker"; exit 1; }
          done
      - name: Record the build
        run: |
          {
            echo "wine: athei/wine@$(git -C wine rev-parse HEAD)"
            echo "repo: $GITHUB_REPOSITORY@$GITHUB_SHA"
            echo "patches: $(cd patches && ls)"
            echo "llvm-mingw: $LLVM_MINGW"
            echo "sdk: $(xcrun --show-sdk-version), MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
            (cd out && shasum -a 256 $(find . -type f | sort))
            for f in out/*/dlls/*/*.so; do otool -L "$f"; done
          } | tee out/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wine-arm64-modules
          path: out
          retention-days: 14
          if-no-files-found: error
